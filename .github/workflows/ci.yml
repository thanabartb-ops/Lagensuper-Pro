name: V11 Continuous Integration

on:
  push:
    branches: [ "main", "agent/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint / Typecheck
        run: npm run lint

      - name: Run Runtime Tests
        run: npm test

      - name: Build Application & Server
        run: npm run build
