name: LSUPERAGENT PRO R1 Verify Once

on:
  push:
    branches:
      - agent/pro-r1-shell-v1
    paths:
      - .github/workflows/pro-r1-verify-once.yml

permissions:
  contents: write

jobs:
  verify:
    name: PRO-R1 fresh verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_DIR: lsuperagent-pro
      EVIDENCE_DIR: /tmp/pro-r1-verify

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/pro-r1-shell-v1
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frozen dependencies
        working-directory: lsuperagent-pro
        run: pnpm install --frozen-lockfile

      - name: Verify regression sensitivity RED
        shell: bash
        working-directory: lsuperagent-pro
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp app/page.tsx "$EVIDENCE_DIR/page.tsx"
          cp app/api/health/route.ts "$EVIDENCE_DIR/health-route.ts"
          cp .env.example "$EVIDENCE_DIR/env.example"
          cat > app/page.tsx <<'EOF'
          export default function Home() {
            return <main>placeholder</main>
          }
          EOF
          rm app/api/health/route.ts .env.example
          set +e
          pnpm vitest run tests/pro-r1.test.tsx 2>&1 | tee "$EVIDENCE_DIR/red.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          cp "$EVIDENCE_DIR/page.tsx" app/page.tsx
          cp "$EVIDENCE_DIR/health-route.ts" app/api/health/route.ts
          cp "$EVIDENCE_DIR/env.example" .env.example
          printf 'PASS: regression tests fail when PRO-R1 behavior is removed.\n' > "$EVIDENCE_DIR/red-summary.txt"

      - name: Fresh Vitest
        shell: bash
        working-directory: lsuperagent-pro
        run: set -o pipefail; pnpm vitest run 2>&1 | tee "$EVIDENCE_DIR/vitest.log"

      - name: Fresh lint
        shell: bash
        working-directory: lsuperagent-pro
        run: set -o pipefail; pnpm lint 2>&1 | tee "$EVIDENCE_DIR/lint.log"

      - name: Fresh typecheck
        shell: bash
        working-directory: lsuperagent-pro
        run: set -o pipefail; pnpm exec tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"

      - name: Fresh build
        shell: bash
        working-directory: lsuperagent-pro
        run: set -o pipefail; pnpm build 2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Security and contract scan
        shell: bash
        run: |
          set -euxo pipefail
          test "$(grep -Ev '^(#|$)' "$APP_DIR/.env.example" | cut -d= -f1 | paste -sd ',' -)" = 'NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_APP_ENV'
          grep -F "gateway: 'NOT_CONNECTED'" "$APP_DIR/app/api/health/route.ts" >/dev/null
          grep -F "backend: 'NOT_CONNECTED'" "$APP_DIR/app/api/health/route.ts" >/dev/null
          if grep -RIE '(SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY|GITHUB_TOKEN|VERCEL_TOKEN|sk-[A-Za-z0-9_-]{12,})' \
            "$APP_DIR/app" "$APP_DIR/tests" "$APP_DIR/.env.example"; then
            echo 'Forbidden privileged secret name or token-like value detected.' >&2
            exit 1
          fi
          git diff --check
          printf 'PASS: public env, honest NOT_CONNECTED semantics, and secret-name scan.\n' > "$EVIDENCE_DIR/security-summary.txt"

      - name: Record evidence
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$APP_DIR/docs/evidence"
          SOURCE_SHA='d201075db207f60fbc1049e76ae5cd96e40f9188'
          VERIFY_BASE_SHA="$(git rev-parse HEAD)"
          TEST_SUMMARY="$(grep -E 'Tests[[:space:]]+[0-9]+ passed|Test Files[[:space:]]+[0-9]+ passed' "$EVIDENCE_DIR/vitest.log" | sed 's/^[[:space:]]*//' | tr '\n' '; ' || true)"
          BUILD_SUMMARY="$(grep -E 'Compiled successfully|Creating an optimized production build|Route \(app\)' "$EVIDENCE_DIR/build.log" | sed 's/^[[:space:]]*//' | tr '\n' '; ' || true)"
          cat > "$APP_DIR/docs/evidence/PRO-R1-VERIFY.md" <<EOF
          # PRO-R1 verification evidence

          - Source commit: \`$SOURCE_SHA\`
          - Verification base: \`$VERIFY_BASE_SHA\`
          - Branch: \`agent/pro-r1-shell-v1\`
          - Package manager: pnpm
          - Node: 22
          - Regression sensitivity: PASS (contract tests failed after removing identity, health route, and env contract; source restored before GREEN verification)
          - Vitest: PASS — ${TEST_SUMMARY:-summary line not emitted; command exited 0}
          - Lint: PASS — \`pnpm lint\` exited 0
          - Typecheck: PASS — \`pnpm exec tsc --noEmit\` exited 0
          - Build: PASS — ${BUILD_SUMMARY:-command exited 0}
          - Security/contract scan: PASS
          - Supabase schema changed: NO
          - Parallel memory/runtime created: NO
          - Deployment created: NO
          - Production changed: NO
          EOF
          git add "$APP_DIR/docs/evidence/PRO-R1-VERIFY.md"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(pro-r1): record fresh verification evidence'
          git push origin HEAD:agent/pro-r1-shell-v1
